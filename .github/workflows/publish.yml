name: Publish to the MCP Registry

# A version tag is the last step of a release (see the monorepo's docs/operations/mcp-directories.md),
# so it is what publishes `server.json` to the official MCP Registry. The registry keeps whatever was
# published last, and PulseMCP, Glama, GitHub's registry and VS Code's gallery copy it from there.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  # Pinned and checked: this binary is handed the registry signing key.
  PUBLISHER_VERSION: '1.8.7'
  PUBLISHER_SHA256: '00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: The tag is the version in server.json
        run: |
          version=$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match server.json's version ${version}; nothing was published."
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: The files agree with each other, the registry's schema and the live server
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet 'jsonschema==4.25.1'
          .venv/bin/python scripts/check.py --live

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  publisher.tar.gz" | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher validate

      - name: Publish
        env:
          MCP_REGISTRY_KEY: ${{ secrets.MCP_REGISTRY_KEY }}
        run: |
          # The secret is the PEM file; login wants the 32-byte Ed25519 seed as hex.
          key=$(printf '%s\n' "$MCP_REGISTRY_KEY" | openssl pkey -outform DER | tail -c 32 | od -An -v -tx1 | tr -d ' \n')
          echo "::add-mask::${key}"
          ./mcp-publisher login dns --domain infranest.io --private-key "${key}"
          ./mcp-publisher publish

      - name: The registry answers the new version
        run: |
          curl -fsS 'https://registry.modelcontextprotocol.io/v0/servers?search=infranest' \
            | python3 -c 'import json, os, sys
          versions = [s["server"]["version"] for s in json.load(sys.stdin)["servers"] if s["server"]["name"] == "io.infranest/infranest"]
          print("registry has", versions)
          sys.exit(0 if os.environ["VERSION"] in versions else 1)'
